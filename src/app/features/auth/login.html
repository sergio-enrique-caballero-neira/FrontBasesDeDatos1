<main class="auth">
  <div class="auth-panel">
    <div class="auth-cabecera">
      <p class="auth-marca">{{ nombreApp }}</p>
      <app-boton-tema />
    </div>
    <h1 class="mb-1">Iniciar sesión</h1>
    <p class="text-body-secondary mb-4">Ingresa con tu correo empresarial y tu contraseña.</p>

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate class="card">
      <div class="card-body d-grid gap-3">
        @if (error(); as error) {
          <div class="alert alert-danger d-flex gap-2 mb-0" role="alert">
            <fa-icon [icon]="iconoError" class="mt-1" />
            <span>{{ error }}</span>
          </div>
        }

        <div>
          <label for="correo" class="form-label">Correo empresarial</label>
          <input
            id="correo"
            type="email"
            class="form-control"
            formControlName="correo"
            autocomplete="username"
            placeholder="nombre@empresa.com"
            [class.is-invalid]="form.controls.correo.invalid && (form.controls.correo.touched || enviado())"
            aria-describedby="correo-error"
          />
          <app-campo-error [control]="form.controls.correo" [enviado]="enviado()" id="correo-error" />
        </div>

        <div>
          <label for="contrasena" class="form-label">Contraseña</label>
          <div class="campo-clave">
            <input
              #campoContrasena
              id="contrasena"
              type="password"
              class="form-control"
              formControlName="contrasena"
              autocomplete="current-password"
              [class.is-invalid]="form.controls.contrasena.invalid && (form.controls.contrasena.touched || enviado())"
              aria-describedby="contrasena-error"
            />
            <app-ver-clave [campo]="campoContrasena" />
          </div>
          <app-campo-error [control]="form.controls.contrasena" [enviado]="enviado()" id="contrasena-error" />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="entrando()">
          @if (entrando()) {
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Verificando…
          } @else {
            Ingresar
          }
        </button>
      </div>
    </form>
  </div>
</main>
